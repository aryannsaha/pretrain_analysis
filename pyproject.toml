[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pretrain-analysis"
description = "Workspace utilities for fine-tuning pre-trained atomistic models."
version = "0.1.0"
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Aryan" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
analysis = [
    "ase>=3.23",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "wandb>=0.17",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pretrain_analysis*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-p no:warnings", "--import-mode=importlib"]
pythonpath = "src"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "scripts", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
