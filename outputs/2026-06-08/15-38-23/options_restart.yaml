device: cpu
base_precision: 32
seed: 42
test_set: 0.0
architecture:
  name: pet
  model:
    cutoff: 4.5
    num_neighbors_adaptive: null
    adaptive_cutoff_method: solver
    cutoff_function: Bump
    cutoff_width: 0.5
    d_pet: 128
    d_head: 128
    d_node: 256
    d_feedforward: 256
    num_heads: 8
    num_attention_layers: 2
    num_gnn_layers: 2
    normalization: RMSNorm
    activation: SwiGLU
    attention_temperature: 1.0
    transformer_type: PreLN
    featurizer_type: feedforward
    zbl: false
    long_range:
      enable: false
      use_ewald: false
      smearing: 1.4
      kspace_resolution: 1.33
      interpolation_nodes: 5
  training:
    distributed: false
    distributed_port: 39591
    batch_size: 1
    num_epochs: 1
    warmup_fraction: 0.01
    learning_rate: 1.0e-05
    weight_decay: null
    log_interval: 1
    checkpoint_interval: 1
    atomic_baseline: {}
    scale_targets: true
    fixed_scaling_weights: {}
    per_structure_targets: []
    num_workers: 0
    log_mae: true
    log_separate_blocks: false
    best_model_metric: mae_prod
    grad_clip_norm: 1.0
    loss:
      energy/r2scan_d4:
        type: mse
        weight: 20.0
        reduction: mean
        gradients:
          positions:
            type: mse
            weight: 2.0
            reduction: mean
          strain:
            type: mse
            weight: 1.0
            reduction: mean
    batch_atom_bounds:
    - null
    - null
    max_atoms_per_batch: null
    min_atoms_per_batch: 0
    finetune:
      read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/models/pretrained/pet-omat-s-v1.0.0.ckpt
      method: full
      config: {}
      inherit_heads: {}
training_set:
- systems:
    read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/train.extxyz
    reader: ase
    length_unit: angstrom
  targets:
    energy/r2scan_d4:
      quantity: energy
      read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/train.extxyz
      reader: ase
      key: moff_energy
      unit: eV
      sample_kind: system
      type: scalar
      num_subtargets: 1
      description: MOF-OFF R2SCAN-D4 total energy
      forces:
        read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/train.extxyz
        reader: ase
        key: moff_forces
      stress:
        read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/train.extxyz
        reader: ase
        key: moff_stress
      virial: false
validation_set:
- systems:
    read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/val.extxyz
    reader: ase
    length_unit: angstrom
  targets:
    energy/r2scan_d4:
      quantity: energy
      read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/val.extxyz
      reader: ase
      key: moff_energy
      unit: eV
      sample_kind: system
      type: scalar
      num_subtargets: 1
      description: MOF-OFF R2SCAN-D4 total energy
      forces:
        read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/val.extxyz
        reader: ase
        key: moff_forces
      stress:
        read_from: /scratch/gpfs/ROSENGROUP/aryan/pretrain_analysis/data/processed/mof-off/r2scan-d4/upet_smoke/val.extxyz
        reader: ase
        key: moff_stress
      virial: false
